
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f07828">
<title>ChopLink - Order Delicious Food</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#fffaf4;color:#29231f}
header{background:#f07828;color:white;padding:22px 18px;border-radius:0 0 24px 24px}
.logo{font-size:27px;font-weight:900}
.tag{font-size:13px;margin-top:5px}
.location{font-size:13px;margin-top:22px}
.search{width:100%;padding:14px;border:0;border-radius:12px;margin-top:14px;font-size:15px}
main{padding:18px}
h2{font-size:19px;margin:22px 0 14px}
.categories{display:flex;gap:12px;overflow-x:auto}
.category{background:white;border:1px solid #f1e5d8;border-radius:14px;padding:13px;min-width:83px;text-align:center;font-size:13px}
.category span{display:block;font-size:27px;margin-bottom:6px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 3px 12px #0000000d}
.foodpic{height:110px;background:#ffead5;display:grid;place-items:center;font-size:55px}
.info{padding:11px}
.info h3{font-size:15px;margin:2px 0 6px}
.muted{font-size:12px;color:#777}
.price{font-weight:bold;color:#e86c20;margin:10px 0}
.add{background:#f07828;color:white;border:0;padding:10px;border-radius:9px;width:100%;font-weight:bold}
.cart{position:fixed;bottom:14px;left:14px;right:14px;background:#28231f;color:white;padding:16px;border:0;border-radius:14px;font-size:15px;font-weight:bold}
.empty{color:#777;font-size:14px}
</style>
</head>
<body>
<header>
  <div class="logo">🍲 ChopLink</div>
  <div class="tag">Good food. Easy ordering.</div>
  <div class="location">📍 Delivering to your location</div>
  <input class="search" id="search" placeholder="Search for food or restaurants...">
</header>

<main>
  <h2>Explore categories</h2>
  <div class="categories">
    <div class="category"><span>🍚</span>Rice</div>
    <div class="category"><span>🍗</span>Chicken</div>
    <div class="category"><span>🍲</span>Soups</div>
    <div class="category"><span>🍔</span>Fast food</div>
    <div class="category"><span>🥤</span>Drinks</div>
  </div>

  <h2>Popular restaurants</h2>
  <p class="muted">Discover food vendors on ChopLink.</p>
  <div id="restaurants" class="grid"></div>

  <h2>Popular meals</h2>
  <div id="foods" class="grid"></div>
</main>

<button class="cart" id="cart" onclick="checkout()">
  🛒 View cart (0) · ₦0
</button>

<script>
const meals=[
 {name:"Smoky Jollof Rice",restaurant:"Ojadi Delicious Meal",price:2500,icon:"🍛"},
 {name:"Fried Rice & Chicken",restaurant:"Ojadi Delicious Meal",price:3500,icon:"🍗"},
 {name:"Rice & Stew",restaurant:"Mama's Kitchen",price:2000,icon:"🍚"},
 {name:"Egusi Soup & Swallow",restaurant:"Tasty Bites",price:3000,icon:"🍲"},
 {name:"Pepper Soup",restaurant:"Mama's Kitchen",price:2800,icon:"🥘"},
 {name:"Burger & Fries",restaurant:"Quick Foods",price:4000,icon:"🍔"}
];
const restaurants=[
 {name:"Ojadi Delicious Meal",icon:"🍛"},
 {name:"Mama's Kitchen",icon:"👩‍🍳"},
 {name:"Tasty Bites",icon:"🍲"},
 {name:"Quick Foods",icon:"🍔"}
];
let cart=[];

function naira(n){return "₦"+n.toLocaleString("en-NG")}

function showRestaurants(){
 document.getElementById("restaurants").innerHTML=restaurants.map(r=>`
 <div class="card">
 <div class="foodpic">${r.icon}</div>
 <div class="info"><h3>${r.name}</h3>
 <p class="muted">Food vendor · View meals</p></div></div>
 `).join("");
}

function showMeals(list=meals){
 document.getElementById("foods").innerHTML=list.length?list.map((m,i)=>`
 <div class="card">
 <div class="foodpic">${m.icon}</div>
 <div class="info">
 <h3>${m.name}</h3>
 <div class="muted">${m.restaurant}</div>
 <div class="price">${naira(m.price)}</div>
 <button class="add" onclick="addToCart(${meals.indexOf(m)})">+ Add to cart</button>
 </div></div>`).join(""):'<p class="empty">No meals found.</p>';
}

function addToCart(i){
 cart.push(meals[i]);
 updateCart();
}

function updateCart(){
 const total=cart.reduce((s,m)=>s+m.price,0);
 document.getElementById("cart").textContent=
 `🛒 View cart (${cart.length}) · ${naira(total)}`;
}

function checkout(){
 if(!cart.length){alert("Your cart is empty!");return;}
 let total=cart.reduce((s,m)=>s+m.price,0);
 let items=cart.map(m=>m.name).join(", ");
 alert("Your order: "+items+"\nTotal: "+naira(total)+
 "\n\nThis is a demonstration. Real ordering and payment will be added later.");
}

document.getElementById("search").addEventListener("input",e=>{
 const q=e.target.value.toLowerCase();
 showMeals(meals.filter(m=>
 m.name.toLowerCase().includes(q)||
 m.restaurant.toLowerCase().includes(q)
 ));
});

showRestaurants();
showMeals();
</script>
</body>
</html>
