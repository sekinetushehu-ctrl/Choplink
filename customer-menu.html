
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ChopLink - Order Food</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{margin:0;background:#fff8ef;font-family:Arial,sans-serif;color:#292929}
header{background:#f47b20;color:white;padding:22px 16px}
header h1{margin:0}
header p{margin-bottom:0}
main{max-width:1000px;margin:auto;padding:16px}
input,textarea,select{width:100%;padding:14px;border:1px solid #ddd;border-radius:9px;font-size:16px;margin:8px 0 14px}
textarea{min-height:85px;resize:vertical}
#foodList{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:15px}
.food{background:white;border-radius:12px;overflow:hidden;box-shadow:0 2px 9px #00000012}
.food img{width:100%;height:170px;object-fit:cover;background:#eee}
.food-content{padding:14px}
.food h3{margin:0 0 8px}
.vendor{color:#777;font-size:14px}
.price{color:#e66d12;font-weight:bold;font-size:18px}
button{background:#f47b20;color:white;border:0;padding:12px 18px;border-radius:7px;font-size:15px;cursor:pointer}
button:disabled{opacity:.5;cursor:not-allowed}
#status{text-align:center;padding:15px}
#cart,#checkoutForm{background:white;padding:16px;border-radius:12px;margin:24px 0;box-shadow:0 2px 9px #00000012}
.cart-item{display:flex;justify-content:space-between;align-items:center;gap:10px;border-bottom:1px solid #eee;padding:12px 0}
.cart-controls{display:flex;align-items:center;gap:8px}
.cart-controls button{padding:7px 12px}
#cartTotal{font-size:20px;font-weight:bold;color:#e66d12}
#placeOrder{width:100%;margin-top:10px}
#checkoutStatus{font-weight:bold;margin-top:12px}
label{font-weight:bold}
</style>
</head>

<body>
<header>
<h1>🍲 ChopLink</h1>
<p>Discover delicious meals from restaurants around you.</p>
</header>

<main>
<h2>Explore All Meals</h2>
<input id="search" placeholder="Search for food or restaurant...">
<p id="status">Loading meals...</p>
<div id="foodList"></div>

<section id="cart">
<h2>🛒 Your Shopping Cart</h2>
<div id="cartItems">Your cart is empty.</div>
<p id="cartTotal">Total: ₦0</p>
</section>

<section id="checkoutForm">
<h2>📦 Customer Checkout</h2>
<p>Enter your details to place your order.</p>

<form id="orderForm">
<label for="customerName">Full name</label>
<input id="customerName" type="text" placeholder="Enter your full name" required>

<label for="customerPhone">Phone number</label>
<input id="customerPhone" type="tel" placeholder="Enter your phone number" required>

<label for="deliveryAddress">Delivery address</label>
<textarea id="deliveryAddress" placeholder="Enter your complete delivery address" required></textarea>

<label for="paymentMethod">Payment method</label>
<select id="paymentMethod">
<option value="cash_on_delivery">Cash on Delivery</option>
<option value="online" disabled>Online Payment - Coming Soon</option>
</select>

<button id="placeOrder" type="submit">Place My Order</button>
<p id="checkoutStatus" aria-live="polite"></p>
</form>
</section>
</main>

<script>
const SUPABASE_URL = "https://ikpfnycvlbdgacrwqvwk.supabase.co";
const SUPABASE_KEY = "sb_publishable_az3jlI2hHW6BjtjWLfZGAw_wPnSj32T";

const client = supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let allFoods = [];
let cart = [];

function naira(amount){
  return "₦" + Number(amount).toLocaleString("en-NG");
}

async function loadFoods(){
  const status = document.getElementById("status");
  status.textContent = "Loading meals...";

  const {data,error} = await client
    .from("customer_food_menu")
    .select("*")
    .order("food_name");

  if(error){
    status.textContent = "Unable to load meals: " + error.message;
    return;
  }

  allFoods = data || [];
  displayFoods(allFoods);
}

function displayFoods(foods){
  const list = document.getElementById("foodList");
  const status = document.getElementById("status");
  list.innerHTML = "";

  if(foods.length === 0){
    status.textContent = "No meals available yet.";
    return;
  }

  status.textContent = foods.length + " meals available";

  foods.forEach(food=>{
    const card = document.createElement("div");
    card.className = "food";

    const img = document.createElement("img");
    img.src = food.image_url || "https://placehold.co/600x400?text=ChopLink+Meal";
    img.alt = food.food_name;
    img.onerror = ()=>{
      img.src = "https://placehold.co/600x400?text=ChopLink+Meal";
    };

    const content = document.createElement("div");
    content.className = "food-content";

    const name = document.createElement("h3");
    name.textContent = food.food_name;

    const vendor = document.createElement("p");
    vendor.className = "vendor";
    vendor.textContent = "Restaurant: " + food.business_name;

    const description = document.createElement("p");
    description.textContent = food.description || "";

    const price = document.createElement("p");
    price.className = "price";
    price.textContent = naira(food.price);

    const addButton = document.createElement("button");
    addButton.textContent = "Add to Cart";
    addButton.addEventListener("click",()=>addToCart(food));

    content.append(name,vendor,description,price,addButton);
    card.append(img,content);
    list.appendChild(card);
  });
}

function addToCart(food){
  const existing = cart.find(item=>item.id === food.id);

  if(existing){
    existing.quantity++;
  }else{
    cart.push({
      id:food.id,
      food_name:food.food_name,
      business_name:food.business_name,
      price:Number(food.price),
      quantity:1
    });
  }

  displayCart();
}

function changeQuantity(id,change){
  const item = cart.find(item=>item.id === id);
  if(!item)return;

  item.quantity += change;

  if(item.quantity <= 0){
    cart = cart.filter(item=>item.id !== id);
  }

  displayCart();
}

function displayCart(){
  const container = document.getElementById("cartItems");
  const totalDisplay = document.getElementById("cartTotal");

  container.innerHTML = "";

  if(cart.length === 0){
    container.textContent = "Your cart is empty.";
  }

  let total = 0;

  cart.forEach(item=>{
    total += item.price * item.quantity;

    const row = document.createElement("div");
    row.className = "cart-item";

    const details = document.createElement("div");

    const name = document.createElement("strong");
    name.textContent = item.food_name;

    const restaurant = document.createElement("p");
    restaurant.className = "vendor";
    restaurant.textContent = item.business_name;

    const amount = document.createElement("p");
    amount.textContent = naira(item.price * item.quantity);

    details.append(name,restaurant,amount);

    const controls = document.createElement("div");
    controls.className = "cart-controls";

    const minus = document.createElement("button");
    minus.textContent = "−";
    minus.addEventListener("click",()=>changeQuantity(item.id,-1));

    const quantity = document.createElement("span");
    quantity.textContent = item.quantity;

    const plus = document.createElement("button");
    plus.textContent = "+";
    plus.addEventListener("click",()=>changeQuantity(item.id,1));

    controls.append(minus,quantity,plus);
    row.append(details,controls);
    container.appendChild(row);
  });

  totalDisplay.textContent = "Total: " + naira(total);
}

document.getElementById("search").addEventListener("input",function(){
  const term = this.value.toLowerCase().trim();

  displayFoods(allFoods.filter(food=>
    (food.food_name || "").toLowerCase().includes(term) ||
    (food.business_name || "").toLowerCase().includes(term)
  ));
});

document.getElementById("orderForm").addEventListener("submit",async function(event){
  event.preventDefault();

  const status = document.getElementById("checkoutStatus");
  const button = document.getElementById("placeOrder");

  if(cart.length === 0){
    status.textContent = "Please add a meal to your cart first.";
    status.style.color = "red";
    return;
  }

  const customerName = document.getElementById("customerName").value.trim();
  const phone = document.getElementById("customerPhone").value.trim();
  const address = document.getElementById("deliveryAddress").value.trim();
  const paymentMethod = document.getElementById("paymentMethod").value;

  if(!customerName || !phone || !address){
    status.textContent = "Please complete all your details.";
    status.style.color = "red";
    return;
  }

  button.disabled = true;
  button.textContent = "Submitting order...";
  status.textContent = "Please wait while we submit your order.";
  status.style.color = "#555";

  const items = cart.map(item=>({
    food_id:item.id,
    quantity:item.quantity
  }));

  try{
    const {data,error} = await client.rpc("submit_choplink_order",{
      p_customer_name:customerName,
      p_phone:phone,
      p_delivery_address:address,
      p_payment_method:paymentMethod,
      p_items:items
    });

    if(error){
      throw error;
    }

    status.textContent = "Order placed successfully! Your order reference is: " + data;
    status.style.color = "green";

    cart = [];
    displayCart();

    document.getElementById("orderForm").reset();

  }catch(error){
    status.textContent = "Order failed: " + error.message;
    status.style.color = "red";
  }finally{
    button.disabled = false;
    button.textContent = "Place My Order";
  }
});

loadFoods();
displayCart();
</script>
</body>
</html>
